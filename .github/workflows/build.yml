name: Build plugin

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    name: Build JS bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Upload bundles to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/yasgui-chart-plugin.min.js
            dist/yasgui-chart-plugin.min.css
